services:
  # ── The Qdrant vector database ──
  qdrant:
    image: qdrant/qdrant:latest      # pull the official Qdrant image (no build needed)
    ports:
      - "6333:6333"                  # dashboard + REST API on localhost:6333
    volumes:
      - qdrant_data:/qdrant/storage  # data survives restarts (stored outside the container)

  # ── Your FastAPI app ──
  app:
    build: .                         # build from your Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY} # pulled from your .env file (below)
      - QDRANT_URL=http://qdrant:6333 # ← talks to the qdrant service by NAME
    depends_on:
      - qdrant                       # start qdrant before app

volumes:
  qdrant_data:                       # a named volume Docker manages for you
