name: CI

# when this runs: on pushes and PRs to main
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # job 1: run the tests
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RAG-QA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install --timeout=1000 --retries=10 torch --index-url https://download.pytorch.org/whl/cpu
          pip install --timeout=1000 --retries=10 -r requirements.txt
      - name: Run tests
        run: pytest -v

  # job 2: build the docker image (only if tests pass)
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t rag-qa RAG-QA

      - name: Run the container
        run: docker run -d -p 8000:8000 --name rag rag-qa

      - name: Ping /health
        run: |
          for i in $(seq 1 15); do
            if curl -fs http://localhost:8000/health; then
              echo "Health check passed!"
              exit 0
            fi
            echo "waiting for container... ($i)"
            sleep 2
          done
          echo "Health check failed - container logs:"
          docker logs rag
          exit 1

      - name: Stop the container
        if: always()
        run: docker rm -f rag


  # ── Job 3: build image → push to ECR → redeploy ECS (main only) ──
  deploy:
    runs-on: ubuntu-latest
    needs: build                            # only after test + build pass
    if: github.ref == 'refs/heads/main'     # deploy only on main, not PRs
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            us-east-1

      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin 386089921957.dkr.ecr.us-east-1.amazonaws.com

      - name: Build & push image
        run: |
          docker build --platform linux/amd64 \
            -t 386089921957.dkr.ecr.us-east-1.amazonaws.com/rag-qa:latest RAG-QA
          docker push 386089921957.dkr.ecr.us-east-1.amazonaws.com/rag-qa:latest

      - name: Redeploy ECS service
        run: |
          aws ecs update-service \
            --cluster rag-qa-cluster \
            --service rag-qa-service \
            --force-new-deployment \
            --region us-east-1
