name: CI

# when this runs: on pushes and PRs to main
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # job 1: run the tests
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RAG-QA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install --timeout=1000 --retries=10 torch --index-url https://download.pytorch.org/whl/cpu
          pip install --timeout=1000 --retries=10 -r requirements.txt
      - name: Run tests
        run: pytest -v

  # job 2: build the docker image (only if tests pass)
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t rag-qa RAG-QA

      - name: Run the container
        run: docker run -d -p 8000:8000 --name rag rag-qa

      - name: Ping /health
        run: |
          for i in $(seq 1 15); do
            if curl -fs http://localhost:8000/health; then
              echo "Health check passed!"
              exit 0
            fi
            echo "waiting for container... ($i)"
            sleep 2
          done
          echo "Health check failed - container logs:"
          docker logs rag
          exit 1

      - name: Stop the container
        if: always()
        run: docker rm -f rag
